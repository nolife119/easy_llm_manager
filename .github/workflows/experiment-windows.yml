name: Experiment Lab Windows smoke tests
on:
  push:
    branches: [feature/vq-experiment-platform]
  workflow_dispatch:
jobs:
  offline-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q experiment_lab.py experiment_sweep.py ds4_vq.py ds4_oneclick.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p "test_experiment_lab.py" -v
      - name: VQ adapter unit tests
        run: python -m unittest discover -s tests -p "test_ds4_vq.py" -v
